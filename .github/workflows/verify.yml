name: Verify mod

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lua and simulated game regression checks
        run: python tests/run.py
      - name: Example layout checks
        run: python tests/render_preview.py
      - name: Verify manual release archive
        run: python tools/package.py
      - name: Verify Workshop archive
        run: python tools/package_workshop.py
